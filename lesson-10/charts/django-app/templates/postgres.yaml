{{- if .Values.postgres.enabled }}
{{/*
Вбудований PostgreSQL — поза умовою завдання, потрібен лише щоб застосунок мав
живу базу і було видно, що змінні з ConfigMap та Secret справді працюють.
Дані в emptyDir: зникають разом з подом, зате не потрібен EBS CSI-драйвер,
без якого PVC у свіжому EKS вічно висить у статусі Pending.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "django-app.postgresName" . }}
  labels:
    {{- include "django-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "django-app.postgresSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "django-app.postgresSelectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.port }}
              protocol: TCP
          # Ті самі ConfigMap і Secret, що й у застосунку: POSTGRES_DB,
          # POSTGRES_USER та POSTGRES_PASSWORD ініціалізують базу.
          envFrom:
            - configMapRef:
                name: {{ include "django-app.configMapName" . }}
            - secretRef:
                name: {{ include "django-app.secretName" . }}
          env:
            # Офіційний образ пише дані в підкаталог, щоб не конфліктувати
            # з вмістом змонтованого тому.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.config.POSTGRES_USER }}"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "django-app.postgresName" . }}
  labels:
    {{- include "django-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres
      protocol: TCP
  selector:
    {{- include "django-app.postgresSelectorLabels" . | nindent 4 }}
{{- end }}
