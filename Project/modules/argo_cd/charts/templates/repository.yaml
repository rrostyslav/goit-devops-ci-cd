{{/*
Репозиторій для Argo CD — це звичайний Secret із міткою
`argocd.argoproj.io/secret-type: repository`. Саме за міткою контролер
знаходить його й підхоплює креденшели.

Для публічного репозиторію список repositories порожній і жодного Secret
не створюється: Argo CD клонує його анонімно.
*/}}
{{- range .Values.repositories }}
---
apiVersion: v1
kind: Secret
metadata:
  name: repo-{{ .name }}
  namespace: {{ $.Values.argocdNamespace }}
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  name: {{ .name | quote }}
  url: {{ .url | quote }}
  type: git
  {{- if .username }}
  username: {{ .username | quote }}
  password: {{ .password | quote }}
  {{- end }}
{{- end }}
