# =============================================================================
# Локальний запуск застосунку — той самий образ, що потім їде в EKS
# =============================================================================
# У кластері ці ж змінні середовища приїжджають до контейнера з ConfigMap
# (несекретні) і Secret (пароль, ключ Django) — див. charts/django-app.
# Тут вони зібрані в одному файлі, бо на локальній машині розділяти нічого:
# compose-файл і так лежить поруч із кодом.
#
#   docker compose up --build      підняти застосунок і базу
#   curl http://localhost:8000/    перевірити: "database": "ok"
#   docker compose down -v         зупинити й прибрати том з даними

services:
  web:
    build:
      # Контекст — уся папка Django/: Dockerfile копіює код з підпапки app/.
      context: .
      dockerfile: Dockerfile
    image: django-app:local
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: myproject.settings
      DJANGO_ENV: development
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_SECRET_KEY: "django-insecure-local-only-do-not-use-in-production"
      POSTGRES_DB: django_db
      POSTGRES_USER: django_user
      POSTGRES_PASSWORD: django_password
      # Ім'я сервісу нижче: у мережі compose воно резолвиться в його IP.
      # У кластері на це місце стає endpoint RDS.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        # Не просто "запустився", а "відповідає на pg_isready": без цього
        # web стартує швидше за базу й перший запит бачить "unavailable".
        condition: service_healthy
    restart: unless-stopped

  db:
    # Та сама мажорна версія, що й у RDS за замовчуванням (postgres 16),
    # щоб локальна поведінка збігалася з хмарною.
    image: postgres:16
    environment:
      POSTGRES_DB: django_db
      POSTGRES_USER: django_user
      POSTGRES_PASSWORD: django_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U django_user -d django_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
