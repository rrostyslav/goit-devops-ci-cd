{{/*
Чутливі змінні середовища (пароль БД, DJANGO_SECRET_KEY).
Механізм підключення той самий, що й у ConfigMap (`envFrom`), але тип ресурсу
інший: вміст ConfigMap читає будь-який workload у неймспейсі відкритим текстом.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "django-app.secretName" . }}
  labels:
    {{- include "django-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
